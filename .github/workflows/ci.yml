name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portfolio_user:testpassword@localhost:5432/portfolio_test
      APP_ENV: staging
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long-strictly-enforced!
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Test Database Migrations (Alembic Upgrade)
        run: |
          alembic upgrade head

      - name: Seed Database
        run: |
          python -m backend.seed.seed_data

      - name: Run Test Suite (Pytest)
        run: |
          PYTHONPATH=. pytest backend/tests/ -v --durations=10

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build
