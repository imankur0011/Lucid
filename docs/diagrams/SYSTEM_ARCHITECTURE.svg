    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Lucid: Six-Tier Decoupled System Architecture</text>
  <text x="550" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#64748B">Modular Enterprise Architecture for Goal-Based Retail Wealth Management</text>

  <!-- TIER 1: Presentation Layer -->
  <g transform="translate(40, 85)">
    <rect width="1020" height="95" rx="10" fill="#F8FAFC" stroke="#0284C7" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="1020" height="28" rx="10" fill="#E0F2FE"/>
    <rect y="18" width="1020" height="10" fill="#E0F2FE"/>
    <text x="20" y="20" font-size="14" font-weight="700" fill="#0369A1">TIER 1: CLIENT PRESENTATION LAYER (Next.js 16.4 • React 19 • Tailwind CSS)</text>
    <text x="990" y="20" text-anchor="end" font-size="12" font-weight="600" fill="#0284C7">PORT 3000</text>
    
    <!-- 4 Sub-modules -->
    <rect x="20" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="135" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Investor Onboarding</text>
    <text x="135" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">5-Question Risk &amp; Mandate</text>

    <rect x="270" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="385" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Portfolio Dashboard</text>
    <text x="385" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Whole Shares &amp; NAV Charts</text>

    <rect x="520" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="635" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">2-Level Stock-Why Modal</text>
    <text x="635" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Plain-English &amp; Exchange Links</text>

    <rect x="770" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="885" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Demat CAS &amp; Drift Radar</text>
    <text x="885" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">HHI Audit &amp; Trade Previews</text>
  </g>

  <!-- Flow 1->2 Connector -->
