    <rect x="270" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="385" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Portfolio &amp; Why Services</text>
    <text x="385" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Creation, Versioning &amp; Proofs</text>

    <rect x="520" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="635" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Demat Diagnosis Service</text>
    <text x="635" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">pdfplumber CAS Parser &amp; HHI</text>

    <rect x="770" y="38" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="885" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">300s Drift Monitoring</text>
    <text x="885" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Session Lock 847291 • Alerts</text>
