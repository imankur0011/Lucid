    <line x1="237" y1="161" x2="253" y2="161" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="253" y="140" width="222" height="42" rx="5" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
