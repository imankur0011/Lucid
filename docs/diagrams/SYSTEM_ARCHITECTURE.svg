    <!-- Step 2: Lot Rounding -->
    <rect x="15" y="88" width="460" height="42" rx="5" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
    <text x="245" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Whole-Share Integer Lot Sizing &amp; Cash Conservation</text>
    <text x="245" y="121" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">Floor: Qi = ⌊(wi* · V) / Pi⌋ • Greedy Remainder Pass • Guarantee: Cash ≥ ₹0</text>

    <!-- Step 3: Statutory Costs -->
    <rect x="15" y="138" width="460" height="42" rx="5" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
    <text x="245" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Statutory Indian Transaction Cost Engine (Oct 2024 SEBI)</text>
