    <text x="405" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Mandate &amp; Concentration Audit</text>
    <text x="405" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">Temp 0.1 • Strict Skeptic</text>

    <line x1="515" y1="66" x2="555" y2="66" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>

