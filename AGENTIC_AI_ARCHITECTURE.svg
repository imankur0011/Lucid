    <rect x="25" y="36" width="210" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="130" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">N3: Macro Analyst</text>
    <text x="130" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">RBI Repo 6.50% • CPI 5.10%</text>
    <text x="130" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">OUT: Cash Buffer 2.5–5%</text>

    <line x1="235" y1="66" x2="265" y2="66" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="265" y="36" width="210" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="370" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">N4: Market Analyst</text>
    <text x="370" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">India VIX • 200-DMA Trend</text>
    <text x="370" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">OUT: Regime &amp; Beta Cap</text>

    <line x1="475" y1="66" x2="505" y2="66" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

