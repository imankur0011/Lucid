    <!-- Node 10A: SLSQP -->
    <rect x="25" y="36" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="135" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 10A: SciPy SLSQP</text>
    <text x="135" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Max Sharpe / Min Variance</text>
    <text x="135" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Bounds: Stock ≤25%, Sec ≤40%</text>

    <line x1="245" y1="66" x2="275" y2="66" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 10B: Integer Rounding -->
    <rect x="275" y="36" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="390" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 10B: Integer Sizing</text>
    <text x="390" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Floor Lots: Qi = ⌊(wi* · V)/Pi⌋</text>
    <text x="390" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Guaranteed Cash Reserve ≥ ₹0</text>

    <line x1="505" y1="66" x2="545" y2="66" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Router D4: Invariant Gate -->
    <polygon points="605,41 665,66 605,91 545,66" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="605" y="64" text-anchor="middle" font-size="11" font-weight="800" fill="#166534">D4: Valid?</text>
    <text x="605" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="#64748B">Stock/Sec Caps</text>

    <line x1="665" y1="66" x2="725" y2="66" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="695" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">Pass</text>

    <!-- Node 11 Verification Badge -->
    <rect x="725" y="36" width="230" height="60" rx="6" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
    <text x="840" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Node 11: Compliance Gate</text>
    <text x="840" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#14532D">100% Invariants Satisfied</text>
    <text x="840" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Div Score 95.5 • Sharpe 0.41</text>
  </g>

  <!-- Flow 4 -> 5 Connector -->
  <line x1="525" y1="628" x2="525" y2="648" stroke="#0F172A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 5: Fiduciary Explanation & ACID Persistence -->
  <g transform="translate(35, 650)">
    <rect width="980" height="100" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="24" rx="4" fill="#E2E8F0"/>
    <text x="160" y="17" text-anchor="middle" font-size="11" font-weight="800" fill="#0F172A">STAGE 5: FIDUCIARY EXPLANATION &amp; PERSISTENCE</text>

    <!-- Node 12 -->
    <rect x="25" y="34" width="300" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="175" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 12: Fiduciary Moderator</text>
    <text x="175" y="73" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Level-1 Thesis &amp; Level-2 NSE/BSE Proofs</text>

    <line x1="325" y1="60" x2="365" y2="60" stroke="#0F172A" stroke-width="2" marker-end="url(#arr)"/>

