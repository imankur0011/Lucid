    <polygon points="630,35 690,60 630,85 570,60" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="630" y="58" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">D1: Pass?</text>
    <text x="630" y="71" text-anchor="middle" font-size="9" font-weight="600" fill="#64748B">≥5 Stocks/3 Sec</text>

    <!-- Branch Pass -->
    <line x1="690" y1="60" x2="745" y2="60" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="715" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">Pass</text>

    <!-- Stage 1 Output Card -->
    <rect x="745" y="34" width="210" height="52" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <text x="850" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">Suitability Approved</text>
    <text x="850" y="73" text-anchor="middle" font-size="11" font-weight="500" fill="#134E4A">504 Liquid Pool to Stage 2</text>
  </g>

