    <text x="140" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Selects K ∈ [10..16] Candidates</text>
    <text x="140" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">Core • Growth • Defensive</text>

    <line x1="255" y1="66" x2="295" y2="66" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>

