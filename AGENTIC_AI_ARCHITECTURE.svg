    <polygon points="615,41 675,66 615,91 555,66" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="615" y="64" text-anchor="middle" font-size="11" font-weight="800" fill="#6D28D9">D2: Approved?</text>
    <text x="615" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="#64748B">Caps &amp; Ethics</text>

    <!-- Branch Rework Loop back to Node 9 -->
    <path d="M 615,41 L 615,28 L 405,28 L 405,36" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrRed)"/>
    <rect x="475" y="20" width="80" height="15" rx="3" fill="#FEE2E2"/>
    <text x="515" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#DC2626">Rework (≤2)</text>

    <!-- Branch Approved to Math -->
    <line x1="675" y1="66" x2="735" y2="66" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="705" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">Approved</text>

