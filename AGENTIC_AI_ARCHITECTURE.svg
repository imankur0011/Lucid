    <rect width="280" height="24" rx="4" fill="#DBEAFE"/>
    <text x="140" y="17" text-anchor="middle" font-size="11" font-weight="800" fill="#1E40AF">STAGE 2: CHAINED SPECIALIST RESEARCH ANALYSTS</text>

