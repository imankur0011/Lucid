<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 820" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="525" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#0F172A">Lucid: 13-Node LangGraph Multi-Agent Workflow</text>
  <text x="525" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#64748B">Five-Stage Sequential Research, Deterministic Optimization &amp; Fiduciary Explanations</text>

  <!-- Shared State Header Bar -->
  <g transform="translate(35, 75)">
    <rect width="980" height="42" rx="8" fill="#0F172A" filter="url(#shadow)"/>
    <text x="25" y="26" font-size="13" font-weight="700" fill="#F8FAFC">SHARED GRAPH STATE: PortfolioAgentState (35 Fields in backend/agent/state.py)</text>
    <text x="960" y="26" text-anchor="end" font-size="11" font-weight="600" fill="#94A3B8">Mandate (11) • Universe (3) • Analysts (4) • Critic (7) • Math &amp; Proofs (10)</text>
  </g>

  <!-- STAGE 1: Suitability Gate -->
  <g transform="translate(35, 132)">
    <rect width="980" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
    <rect width="180" height="24" rx="4" fill="#CCFBF1"/>
    <text x="90" y="17" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">STAGE 1: SUITABILITY GATE</text>

    <!-- Node 1 -->
    <rect x="25" y="34" width="220" height="52" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="135" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 1: Manager</text>
    <text x="135" y="73" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Parse Mandate &amp; Init State</text>

    <line x1="245" y1="60" x2="280" y2="60" stroke="#0D9488" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 2 -->
    <rect x="280" y="34" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="405" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 2: Suitability Checker</text>
    <text x="405" y="73" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">₹10k Min • 504 Liquid Equities</text>

    <line x1="530" y1="60" x2="570" y2="60" stroke="#0D9488" stroke-width="2" marker-end="url(#arr)"/>

