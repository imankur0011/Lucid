    <text x="520" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Node 13: PostgreSQL ACID Commit</text>
    <text x="520" y="73" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Atomic Write: 6 Tables (Versions, Decisions)</text>

    <line x1="675" y1="60" x2="715" y2="60" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrGreen)"/>

    <!-- Final Output Pill -->
    <rect x="715" y="34" width="240" height="52" rx="26" fill="#15803D" filter="url(#shadow)"/>
    <text x="835" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">ACTIVE PORTFOLIO</text>
    <text x="835" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#DCFCE7">Whole Shares Ready for Review</text>
  </g>

  <!-- Bottom Architectural Safety Pillar -->
  <g transform="translate(35, 765)">
    <rect width="980" height="38" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="490" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">ARCHITECTURAL PILLAR: Strict Separation of Qualitative AI (Nodes 3-9, 12) from Deterministic Math (Nodes 10-11) — Zero Hallucinations</text>
