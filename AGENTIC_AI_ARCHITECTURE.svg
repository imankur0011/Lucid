    <text x="610" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">ROE ≥15% • D/E ≤1.0 • P/E</text>
    <text x="610" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">OUT: Winsorized Z-Scores</text>

    <line x1="715" y1="66" x2="745" y2="66" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="745" y="36" width="210" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="850" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">N6: News &amp; Regulatory</text>
    <text x="850" y="75" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">30d News • Pledges &lt;5%</text>
    <text x="850" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">OUT: Sentiment [-1, +1]</text>
